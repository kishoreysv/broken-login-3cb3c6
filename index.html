<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Auth Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">Existing workflow enhancement</p>
                <h1>Broken Auth Gallery</h1>
                <p class="page-copy">Switch between light and dark themes while keeping the current login and gallery flow unchanged.</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activate dark mode" aria-pressed="false">
                <span class="theme-toggle__label">Dark mode</span>
                <span class="theme-toggle__track" aria-hidden="true">
                    <span class="theme-toggle__thumb"></span>
                </span>
            </button>
        </header>

        <section id="login-container" class="panel" aria-labelledby="login-title">
            <h2 id="login-title">Login to View Images</h2>
            <p class="panel-copy">Use the existing credentials flow to reveal the gallery.</p>
            <label class="sr-only" for="username">Username</label>
            <input type="text" id="username" placeholder="Username" autocomplete="username">
            <label class="sr-only" for="password">Password</label>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button class="primary-action" onclick="attemptLogin()">Login</button>
            <p id="error-msg" role="alert"></p>
        </section>

        <section id="gallery-container" class="panel hidden" aria-labelledby="gallery-title">
            <h2 id="gallery-title">Secret Gallery</h2>
            <p class="panel-copy">The gallery stays fully usable in both themes.</p>
            <div class="gallery-grid">
                <img src="https://picsum.photos/id/1015/300/200" alt="Landscape">
                <img src="https://picsum.photos/id/1016/300/200" alt="Mountains">
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
